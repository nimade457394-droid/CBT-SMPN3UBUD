<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Ujian Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- HALAMAN LOGIN -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-blue-700">CBT UJIAN ONLINE</h1>
        <p class="text-xs text-gray-400 mt-1">Silakan masuk sesuai akun Anda</p>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">Peran User</label>
        <select id="roleSelect" onchange="toggleRoleInput()" class="w-full p-3 border rounded-xl text-sm bg-gray-50 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
        </select>
      </div>

      <div id="kelasContainer" class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">Pilih Kelas</label>
        <input type="text" id="kelas" placeholder="Contoh: 7A, 8B, 9C" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">Username / NIS</label>
        <input type="text" id="username" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-500 mb-1">Password</label>
        <input type="password" id="password" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button id="btnLogin" onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-lg transition">MASUK</button>
    </div>
  </div>

  <!-- HALAMAN PILIH MAPEL (SISWA) -->
  <div id="subjectPage" class="hidden min-h-screen p-6 max-w-4xl mx-auto">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <div>
          <h2 class="text-xl font-black text-gray-800" id="userDisplayName">Selamat Datang</h2>
          <p class="text-xs text-gray-400" id="userDisplayClass">-</p>
        </div>
        <button onclick="logout()" class="text-red-500 text-xs font-bold hover:underline">Keluar</button>
      </div>

      <h3 class="font-bold text-gray-700 mb-2">Pilih Mata Pelajaran:</h3>
      <div class="mb-6">
        <input type="text" id="mapel" placeholder="Contoh: IPA, Matematika, Bahasa Indonesia" class="w-full p-4 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button id="btnMulai" onclick="startExamSequence()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-black shadow-lg transition">MULAI SEKARANG</button>
    </div>
  </div>

  <!-- HALAMAN UJIAN (SISWA) -->
  <div id="examPage" class="hidden min-h-screen p-4 lg:p-8 max-w-7xl mx-auto">
    <!-- BAR DOKUMEN & TIMER -->
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow mb-6 border border-gray-100">
      <div class="font-bold text-blue-700 text-lg" id="timer">00:00:00</div>
      <div class="text-xs text-red-500 font-bold" id="pencatatPelanggaran">Pelanggaran: 0</div>
    </div>

    <div class="grid grid-cols-12 gap-6">
      <!-- AREA SOAL -->
      <div class="col-span-12 lg:col-span-9 bg-white p-6 lg:p-8 rounded-3xl shadow-xl border border-gray-100 flex flex-col justify-between min-h-[500px]">
        <div>
          <div class="flex justify-between items-center mb-6">
            <span class="font-black text-xs uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full" id="infoNomor">Nomor 1</span>
          </div>
          <div id="soalContainer"></div>
        </div>

        <!-- NAVIGASI TOMBOL SOAL -->
        <div class="flex justify-between items-center pt-6 border-t mt-8">
          <button id="prevBtn" onclick="prevSoal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2.5 rounded-xl font-bold text-sm transition">Sebelumnya</button>
          <button id="nextBtn" onclick="nextSoal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm transition ml-auto">Berikutnya</button>
          <button id="finishBtn" onclick="handleStepTransition()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm transition ml-auto">KUMPULKAN JAWABAN</button>
        </div>
      </div>

      <!-- SIDEBAR NAVIGASI NOMOR SOAL -->
      <div class="col-span-12 lg:col-span-3 bg-white p-6 rounded-3xl shadow-xl border border-gray-100 h-fit sticky top-6">
        <h3 class="font-black mb-4 text-center text-gray-400 uppercase tracking-widest text-xs">Navigasi Soal</h3>
        <div class="flex gap-2 mb-6">
          <button id="btnTabPG" onclick="switchMode('PG')" class="flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-blue-700 bg-blue-700 text-white">PG</button>
          <button id="btnTabESAI" onclick="switchMode('ESAI')" class="flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-gray-200 text-gray-400">ESAI</button>
        </div>
        <div id="navGrid" class="flex flex-wrap gap-3 justify-center"></div>
      </div>
    </div>
  </div>

  <!-- HALAMAN DASHBOARD GURU -->
  <div id="guruPage" class="hidden min-h-screen p-6 max-w-6xl mx-auto">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-xl font-black text-gray-800">REKAP HASIL UJIAN</h2>
          <p class="text-xs text-gray-400">Panel Pemantauan Guru</p>
        </div>
        <button onclick="logout()" class="text-red-500 text-xs font-bold hover:underline">Keluar</button>
      </div>

      <div class="flex gap-4 mb-6">
        <input type="text" id="guruKelas" placeholder="Masukkan Kelas (misal: 7A)" class="flex-1 p-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="fetchRekapGuru()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">CARI REKAP</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600 border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b text-gray-700">
              <th class="p-3">Absen</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Benar</th>
              <th class="p-3">Salah</th>
              <th class="p-3">Jawaban Esai</th>
              <th class="p-3">Status</th>
              <th class="p-3">Pelanggaran</th>
            </tr>
          </thead>
          <tbody id="rekapTableBody">
            <tr>
              <td colspan="7" class="p-4 text-center text-gray-400">Silakan masukkan kelas untuk melihat rekap.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const GAS_URL = 'https://https://script.google.com/macros/s/AKfycbw-qtWP891qyOhOQei78vOW-cDiygdquq1Rn1nNPSN3wLaVOrO1DyuibwNqyEQGKvzw/exec'; 

    let userData = {};
    let examConfig = {};
    let questionsPG = [];
    let questionsESAI = [];
    let questions = [];
    let answers = {};
    let currentIdx = 0;
    let currentMode = 'PG';
    let timeLeft = 0;
    let timerInterval = null;
    let countPelanggaran = 0;

    async function callGAS(action, payload = {}) {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action, ...payload })
        });
        return await response.json();
      } catch (e) {
        console.error(e);
        return { success: false, msg: "Gagal terhubung ke server." };
      }
    }

    function toggleRoleInput() {
      const role = document.getElementById('roleSelect').value;
      document.getElementById('kelasContainer').style.display = (role === 'guru') ? 'none' : 'block';
    }

    async function login() {
      const role = document.getElementById('roleSelect').value;
      const kelas = document.getElementById('kelas').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');

      if (!username || !password || (role === 'siswa' && !kelas)) {
        alert("Mohon lengkapi semua kolom!");
        return;
      }

      btn.innerText = "PROSES...";
      btn.disabled = true;

      const res = await callGAS('loginUser', { kelas, username, password, role });
      
      btn.innerText = "MASUK";
      btn.disabled = false;

      if (res.success) {
        userData = { ...res, kelas };
        document.getElementById('loginPage').classList.add('hidden');
        
        if (role === 'guru') {
          document.getElementById('guruPage').classList.remove('hidden');
        } else {
          document.getElementById('userDisplayName').innerText = "Halo, " + res.nama;
          document.getElementById('userDisplayClass').innerText = "Kelas: " + kelas;
          document.getElementById('subjectPage').classList.remove('hidden');
        }
      } else {
        alert(res.msg);
      }
    }

    async function startExamSequence() {
      const mapel = document.getElementById('mapel').value;
      if(!mapel) {
        alert("Silakan isi Mata Pelajaran!");
        return;
      }
      const tk = userData.kelas.substring(0, 1);
      const btn = document.getElementById('btnMulai');
      btn.innerText = "MEMUAT SOAL...";
      btn.disabled = true;

      kioskMode();

      const config = await callGAS('getExamConfig', { mapel, tingkat: tk });
      if (!config || !config.pgUrl) {
        alert("Soal tidak ditemukan! Periksa kesesuaian Nama Mapel dan Tingkat Kelas di Sheet Guru.");
        btn.innerText = "MULAI SEKARANG";
        btn.disabled = false;
        return;
      }

      timeLeft = (config.durasi || 60) * 60;
      examConfig = config;

      // Ambil seluruh soal dari 1 link Google Doc
      const allQuestions = await callGAS('fetchQuestions', { url: config.pgUrl });

      if (!allQuestions || allQuestions.length === 0) {
        alert("Gagal membaca file Google Doc! Pastikan izin link sudah 'Anyone with the link can view'.");
        btn.innerText = "MULAI SEKARANG";
        btn.disabled = false;
        return;
      }

      // Memisahkan soal PG dan ESAI secara otomatis
      questionsPG = shuffleArray(allQuestions.filter(q => q.type === 'PG'));
      questionsESAI = shuffleArray(allQuestions.filter(q => q.type === 'ESAI'));

      if (!timerInterval) startTimer();
      switchMode('PG');

      document.getElementById('subjectPage').classList.add('hidden');
      document.getElementById('examPage').classList.remove('hidden');
    }

    function switchMode(mode) {
      currentMode = mode;
      questions = mode === 'PG' ? questionsPG : questionsESAI;
      
      const btnPG = document.getElementById('btnTabPG');
      const btnESAI = document.getElementById('btnTabESAI');

      if (mode === 'PG') {
        btnPG.className = "flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-blue-700 bg-blue-700 text-white";
        btnESAI.className = "flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-gray-200 text-gray-400";
      } else {
        btnESAI.className = "flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-blue-700 bg-blue-700 text-white";
        btnPG.className = "flex-1 py-2 rounded-xl font-bold text-xs transition-all border-2 border-gray-200 text-gray-400";
      }

      showSoal(0);
    }

    function showSoal(idx) {
      currentIdx = idx;
      if (questions.length === 0) {
        document.getElementById('soalContainer').innerHTML = "<p class='text-center py-10 text-gray-400'>Tidak ada soal pada kategori ini.</p>";
        return;
      }

      const q = questions[idx];
      document.getElementById('infoNomor').innerText = (currentMode === 'PG' ? "PG - Nomor " : "ESAI - Nomor ") + (idx + 1);

      let h = q.img ? `<img src="${q.img}" class="max-w-full h-48 mx-auto mb-6 rounded shadow">` : '';
      h += `<div class="text-lg lg:text-xl mb-6 font-bold text-gray-800">${q.soal}</div>`;

      if (currentMode === 'PG') {
        if (q.options) {
          Object.keys(q.options).forEach(optKey => {
            const val = optKey.toUpperCase();
            const textOption = q.options[optKey];
            const ch = answers["PG_" + idx] === val ? 'checked' : '';

            h += `<label class="block p-4 border rounded-xl mb-3 cursor-pointer hover:bg-blue-50 transition border-gray-200">
                    <input type="radio" name="opt" value="${val}" ${ch} onclick="saveAns('${val}')"> <span class="font-bold mr-2">${val}.</span> ${textOption}
                  </label>`;
          });
        }
      } else {
        const val = answers["ESAI_" + idx] || "";
        h += `<textarea oninput="saveAns(this.value)" class="w-full border-2 border-gray-200 p-4 rounded-xl h-48 focus:ring-4 focus:ring-blue-100 focus:outline-none" placeholder="Tulis jawaban esai Anda di sini...">${val}</textarea>`;
      }

      document.getElementById('soalContainer').innerHTML = h;

      if (window.MathJax) {
        MathJax.typesetPromise([document.getElementById('soalContainer')]).catch(err => console.log(err));
      }

      document.getElementById('prevBtn').classList.toggle('hidden', idx === 0);
      const isLast = idx === questions.length - 1;
      document.getElementById('nextBtn').classList.toggle('hidden', isLast);
      
      // Tombol Kumpulkan Otomatis Muncul di Soal Terakhir ESAI
      const fBtn = document.getElementById('finishBtn');
      fBtn.classList.toggle('hidden', !(currentMode === 'ESAI' && isLast));

      updateNavUI();
    }

    function saveAns(val) {
      answers[currentMode + "_" + currentIdx] = val;
      updateNavUI();
    }

    function updateNavUI() {
      const grid = document.getElementById('navGrid');
      grid.innerHTML = '';
      questions.forEach((_, i) => {
        const isFilled = !!answers[currentMode + "_" + i];
        const isCurrent = i === currentIdx;
        
        let cls = "w-10 h-10 rounded-xl font-bold text-xs flex items-center justify-center transition border ";
        if (isCurrent) cls += "border-blue-700 bg-blue-700 text-white shadow-md ";
        else if (isFilled) cls += "border-emerald-500 bg-emerald-50 text-emerald-700 ";
        else cls += "border-gray-200 bg-gray-50 text-gray-500 ";

        grid.innerHTML += `<button onclick="showSoal(${i})" class="${cls}">${i + 1}</button>`;
      });
    }

    function prevSoal() { if (currentIdx > 0) showSoal(currentIdx - 1); }
    function nextSoal() { if (currentIdx < questions.length - 1) showSoal(currentIdx + 1); }

    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Waktu ujian telah habis!");
          submitExam("Selesai (Waktu Habis)");
          return;
        }
        timeLeft--;
        const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
        const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    function kioskMode() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          countPelanggaran++;
          document.getElementById('pencatatPelanggaran').innerText = "Pelanggaran: " + countPelanggaran;
          alert("PERINGATAN! Jangan meninggalkan atau berpindah tab ujian!");
        }
      });
    }

    function handleStepTransition() {
      if (confirm("Apakah Anda yakin ingin mengumpulkan semua jawaban ujian sekarang?")) {
        submitExam("Selesai");
      }
    }

    async function submitExam(statusString) {
      clearInterval(timerInterval);
      document.getElementById('examPage').innerHTML = `<div class="text-center py-20 font-bold text-lg text-gray-600">Sedang mengirim jawaban...</div>`;

      const res = await callGAS('processFinalSubmit', {
        kelas: userData.kelas,
        row: userData.row,
        answers: answers,
        pgUrl: examConfig.pgUrl,
        status: statusString,
        pelanggaran: countPelanggaran,
        catatan: "Ujian Selesai"
      });

      if (res.success) {
        alert("Jawaban berhasil dikumpulkan!");
        location.reload();
      } else {
        alert("Gagal mengirim jawaban: " + res.msg);
      }
    }

    async function fetchRekapGuru() {
      const k = document.getElementById('guruKelas').value;
      if (!k) { alert("Masukkan nama kelas!"); return; }

      const data = await callGAS('getRekapNilai', { kelas: k });
      const tbody = document.getElementById('rekapTableBody');
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">Data tidak ditemukan.</td></tr>`;
        return;
      }

      data.forEach(r => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 font-bold">${r.absen}</td>
            <td class="p-3">${r.nama}</td>
            <td class="p-3 text-emerald-600 font-bold">${r.benar}</td>
            <td class="p-3 text-red-500 font-bold">${r.salah}</td>
            <td class="p-3 whitespace-pre-wrap text-xs">${r.esai}</td>
            <td class="p-3"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-md text-xs font-bold">${r.status}</span></td>
            <td class="p-3 text-center font-bold text-red-600">${r.pelanggaran}</td>
          </tr>
        `;
      });
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
